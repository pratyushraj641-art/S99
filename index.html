<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="calculator" role="application" aria-label="Simple calculator">
    <div class="display">
      <div class="previous-operand" id="previous-operand"></div>
      <div class="current-operand" id="current-operand">0</div>
    </div>

    <div class="buttons">
      <button class="btn function" id="clear">C</button>
      <button class="btn function" id="delete">⌫</button>
      <button class="btn operator" data-operation="/">÷</button>

      <button class="btn digit" data-number="7">7</button>
      <button class="btn digit" data-number="8">8</button>
      <button class="btn digit" data-number="9">9</button>
      <button class="btn operator" data-operation="*">×</button>

      <button class="btn digit" data-number="4">4</button>
      <button class="btn digit" data-number="5">5</button>
      <button class="btn digit" data-number="6">6</button>
      <button class="btn operator" data-operation="-">−</button>

      <button class="btn digit" data-number="1">1</button>
      <button class="btn digit" data-number="2">2</button>
      <button class="btn digit" data-number="3">3</button>
      <button class="btn operator" data-operation="+">+</button>

      <button class="btn digit zero" data-number="0">0</
